[tox]
envlist =
    flake8
    isort
    py{39,310}-dj{32,42}-sqlite-cms{40,41}

skip_missing_interpreters=True

[testenv]
deps =
    flake8: -r{toxinidir}/tests/requirements/requirements_base.txt
    isort: -r{toxinidir}/tests/requirements/requirements_base.txt

    dj32: Django>=3.2,<4.0
    dj42: Django>=4.2,<5.0
    dj32_cms40: -r{toxinidir}/tests/requirements/django-3_2_cms40.txt
    dj42_cms40: -r{toxinidir}/tests/requirements/django-4_2_cms40.txt
    dj42_cms41: -r{toxinidir}/tests/requirements/django-4_2_cms41.txt

basepython =
    py39: python3.9
    py310: python3.10

commands =
    {envpython} --version
    {env:COMMAND:coverage} erase
    {env:COMMAND:coverage} run setup.py test
    {env:COMMAND:coverage} report

[testenv:flake8]
commands = flake8
basepython = python3.10

[testenv:isort]
commands = isort --recursive --check-only --diff {toxinidir}
basepython = python3.10